x}.mail-links a{display:block;margin:9px 0;overflow-wrap:anywhere;line-height:1.6}.mail-links summary{font-size:13px;font-weight:400;color:#647580;margin-top:12px}.todo-block{margin-top:14px;line-height:1.7}.original-frame{display:block;width:100%;height:60vh;border:0;margin-top:16px}#source-dialog{max-width:900px}.course-filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;padding-top:12px;border-top:1px solid #dde5df}.course-filters button{margin:0;padding:8px 12px;font-size:13px;background:white;color:#52665a;border:1px solid #dbe4de}.course-filters button.active{background:#e4efe8;border-color:#397158;color:#235b4b}.mail-card{padding:18px 20px;margin:14px 0}.mail-header{font-size:15px;font-weight:400;line-height:1.6;cursor:pointer}.mail-header .tag{margin-left:6px}.mail-title{display:block;font-size:17px;font-weight:600;margin:5px 0;overflow-wrap:anywhere}.mail-detail{margin-top:18px;border-top:1px solid #edf0ee;padding-top:2px}.fold-close{font-size:13px;padding:8px 12px}</style><main><div class="top"><h1>邮件助手</h1></div>
<div id="notice" role="status" hidden></div><div id="settings-page" hidden><h2>连接设置</h2>
<section id="mail-settings"><div class="section-heading"><h3>邮箱</h3><span id="mail-ready" class="connection-state" role="status"></span></div><div class="grid"><label>QQ 邮箱<input id="account" placeholder="完整 QQ 邮箱地址" autocomplete="off"></label><div class="secret-field"><label for="password">QQ 邮箱授权码</label><div class="secret-row"><input id="password" type="password" autocomplete="new-password" placeholder="填写 QQ 邮箱授权码"><button type="button" aria-label="更换QQ 邮箱授权码" class="secondary" id="change-password" hidden onclick="editSecret('password')">更换</button></div></div><label>学校邮箱<input id="school_sender" placeholder="填写你自己的学校邮箱" autocomplete="off"></label></div><p class="meta">仅分析此学校邮箱转发的邮件。</p><button class="secondary mail-control" onclick="connectionAction('mail','test')">测试连接</button><button class="mail-control" onclick="connectionAction('mail','save')">保存</button><p id="mail-feedback" role="status"></p></section>
<section id="calendar-settings"><div class="section-heading"><h3 id="calendar-heading">日历</h3><span id="calendar-ready" class="connection-state" role="status"></span></div><label>日历添加方式<select id="calendar_method" onchange="calendarHelp()"><option value="unset">暂不设置</option><option value="subscribe" hidden>同步到我的日历</option><option value="ics">导出日历文件</option><option value="apple">Apple 日历</option></select></label><p id="calendar-help"></p><button onclick="saveCalendar()">保存</button><p id="calendar-feedback" role="status"></p><div id="calendar-subscription" hidden><label for="calendar-url">我的日历链接</label><div class="secret-row"><input id="calendar-url" readonly aria-label="我的日历链接"><button type="button" class="secondary" onclick="copyCalendarUrl()">复制链接</button></div><p class="meta">在 Apple 日历中添加一次“订阅日历”，粘贴这个链接。之后你逐条确认的日程会自动出现在“邮件助手”订阅日历中。订阅只读，刷新时间由日历应用决定；请勿分享此链接。</p><p id="calendar-local-note" class="meta" hidden>当前是本机预览，手机无法访问这个链接；网站上线并使用 HTTPS 后，才可在手机上订阅。</p></div></section>
<section id="ai-settings"><div class="section-heading"><h3>AI 服务</h3><span id="ai-ready" class="connection-state" role="status"></span></div><div class="grid"><label>服务商<select id="provider" onchange="providerChanged()"></select></label><div class="secret-field"><label for="key">API Key</label><div class="secret-row"><input id="key" type="password" autocomplete="new-password" placeholder="填写当前服务商的 API Key"><button type="button" aria-label="更换API Key" class="secondary" id="change-key" hidden onclick="editSecret('key')">更换</button></div></div></div><p id="provider-hint" class="meta"></p><button class="secondary ai-control" onclick="connectionAction('ai','models')">获取模型列表</button><label>模型<select id="model-choice" onchange="modelChoiceChanged()"><option value="">先获取模型列表</option><option value="__manual__">手动输入模型 ID</option></select></label><label id="manual-model" hidden>模型 ID<input id="model" placeholder="服务商提供的模型 ID 或接入点 ID"></label><p class="meta">请选择文本对话模型。</p><details id="ai-advanced"><summary>高级设置</summary><label>接口基础地址<input id="base" placeholder="HTTPS 基础地址"></label><p class="meta">通常无需修改。</p></details><p class="meta">AI 会接收邮件内容，可能产生费用。</p><button class="secondary ai-control" onclick="connectionAction('ai','test')">测试连接</button><button class="ai-control" onclick="connectionAction('ai','save')">保存</button><p id="ai-feedback" role="status"></p></section><p id="settings-status" role="status"></p></div>
<div id="important-page"><h2>重要事项</h2><div id="pins"></div><details id="completed-panel" hidden><summary id="completed-title">已完成</summary><div id="completed-pins"></div></details></div><div id="mail-page" hidden><section class="mail-toolbar" aria-label="自动分析状态"><div class="mail-toolbar-main"><div class="mail-state"><span id="auto-dot" class="status-dot" aria-hidden="true"></span><strong id="auto-label">正在连接…</strong><span class="meta" id="auto-caption"></span></div><div class="mail-actions"><button class="secondary task" onclick="call('/api/fetch',{})">立即检查</button><button class="task" id="auto" onclick="toggleAuto()">开始</button></div></div><div id="status" role="status" hidden></div><button id="setup-link" class="text-button" onclick="showPage('settings')" hidden>去连接设置</button></section><nav class="filters" id="filters" aria-label="邮件分类"></nav><nav id="course-filters" class="course-filters" aria-label="课程分类" hidden></nav><div id="mails"></div></div></main><nav class="tabs" aria-label="页面切换"><button id="nav-important" onclick="showPage('important')">重要事项</button><button id="nav-mail" class="secondary" onclick="showPage('mail')">邮件处理</button><button id="nav-settings" class="secondary" onclick="showPage('settings')">连接设置</button></nav><dialog id="calendar-dialog"><h2>加入日历</h2><div id="calendar-form"></div><p id="calendar-message" role="status"></p><button class="secondary" onclick="$('calendar-dialog').close()">取消</button></dialog><dialog id="source-dialog"><h2>原邮件</h2><div id="source-content"></div><button onclick="$('source-dialog').close()">关闭</button></dialog>
<script>
const categories=['课程与教学','活动与机会','学籍与行政','校园服务','其他'];let selected='全部',selectedCourse='全部课程',state=null;const expandedMails=new Set();
const nativeFetch=window.fetch.bind(window);window.fetch=async(...args)=>{const response=await nativeFetch(...args);if(response.status===401)location.href='/login';return response};const token='__TOKEN__';let enabled=false,last='',initialized=false,calendarMethod='unset';const $=id=>document.getElementById(id);
async function call(path,data){try{let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Token':token},body:JSON.stringify(data)});let d=await r.json();if(!r.ok)throw Error(d.error);await refresh();return true}catch(e){notify(e.message);return false}}
let providers={},aiRevision=0;const connectionStates={mail:'',ai:''};
function connectionBadge(group,ready){let status=connectionStates[group]||(ready?'已保存':'未设置');let e=$(group+'-ready');e.textContent=status==='已保存'?'✓ 已保存':status==='✓ 成功'?'✓ 连接成功':status;e.className='connection-state'+(['✓ 成功','已保存'].includes(status)?' success':status==='失败'?' error':'')}
function connectionEdited(group){connectionStates[group]='未保存';connectionBadge(group,false);$(group+'-feedback').textContent=''}
function modelOptions(models,current=''){$('model-choice').replaceChildren();let blank=element('option',models.length?'请选择模型':'先获取模型列表');blank.value='';$('model-choice').append(blank);for(let id of models){let o=element('option',id);o.value=id;$('model-choice').append(o)}let manual=element('option','手动输入模型 ID');manual.value='__manual__';$('model-choice').append(manual);$('model-choice').value=models.includes(current)?current:current?'__manual__':'';$('model').value=current;modelChoiceChanged()}
function modelChoiceChanged(){let v=$('model-choice').value;$('manual-model').hidden=v!=='__manual__';if(v!=='__manual__')$('model').value=v;aiRevision++}
function providerChanged(){connectionEdited('ai');aiRevision++;let p=providers[$('provider').value];$('base').value=p?.base||'';$('key').value='';$('key').readOnly=false;$('key').dataset.editing='1';$('change-key').hidden=true;modelOptions([]);$('provider-hint').textContent=p?.hint||'';$('ai-advanced').open=$('provider').value==='custom';$('ai-feedback').textContent='请填写对应 API Key'}
function editSecret(id){connectionEdited(id==='password'?'mail':'ai');let e=$(id);e.readOnly=false;e.value='';e.dataset.editing='1';e.placeholder='填写新的凭证';e.focus()}
function savedSecret(id,saved){let e=$(id);if(e.dataset.editing||(!e.readOnly&&e.value))return;e.readOnly=saved;e.value=saved?'••••••••':'';$('change-'+id).hidden=!saved}
function draft(group){let keys=group==='mail'?['account','school_sender','password']:['provider','base','model','key'];return Object.fromEntries(keys.map(k=>[k,$(k).readOnly?'':$(k).value.trim()]))}
async function connectionAction(group,action){let data=draft(group),revision=aiRevision;let controls=document.querySelectorAll('#'+group+'-settings button, #'+group+'-settings input, #'+group+'-settings select');controls.forEach(x=>x.disabled=true);let box=$(group+'-feedback');box.textContent=action==='models'?'正在获取模型列表…':action==='test'?'测试中…':'正在保存…';try{let path='/api/settings/'+group+(action==='save'?'':'/'+action);let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Token':token},body:JSON.stringify(data)});let result=await r.json();if(group==='ai'&&revision!==aiRevision){box.textContent='设置已变更，请重新操作。';return}if(!r.ok)throw Error(result.error||'操作未完成');if(action==='models'){modelOptions(result.models,data.model);box.textContent='已获取 '+result.models.length+' 个模型'}else{box.textContent='';connectionStates[group]=action==='test'?'✓ 成功':(connectionStates[group]==='✓ 成功'?'✓ 成功':'已保存');connectionBadge(group,true);if(action==='save'){let e=$(group==='mail'?'password':'key');e.value='';delete e.dataset.editing;}await refresh()}}catch(e){if(action==='test'){connectionStates[group]='失败';connectionBadge(group,false)}box.textContent=e.message+(action==='models'?' 可手动输入模型 ID。':'')}finally{controls.forEach(x=>x.disabled=false)}}
function calendarHelp(){const v=$('calendar_method').value;$('calendar-help').textContent=v==='apple'?'添加到默认日历':v==='ics'?'下载后打开文件，确认导入。':v==='subscribe'?'先在 Apple 日历订阅一次专属链接，之后确认加入的日程会自动同步。':''}
async function saveCalendar(){let method=$('calendar_method').value;let ok=await call('/api/calendar/settings',{calendar_method:method});if(ok&&method==='subscribe'){try{let r=await fetch('/api/calendar/subscription',{method:'POST',headers:{'Content-Type':'application/json','X-Token':token},body:'{}'});let d=await r.json();if(!r.ok)throw Error(d.error);showCalendarSubscription(d.url)}catch(e){$('calendar-feedback').textContent=e.message;return}}$('calendar-feedback').textContent=ok?'':'保存失败';$('calendar-ready').textContent=ok?(method==='subscribe'?'链接已生成':'✓ 已保存'):'失败';$('calendar-ready').className='connection-state'+(ok&&method!=='subscribe'?' success':!ok?' error':'')}
function showCalendarSubscription(url){$('calendar-subscription').hidden=!url;if(url){$('calendar-url').value=url;$('calendar-local-note').hidden=!url.startsWith('http://127.0.0.1:')}}
async function copyCalendarUrl(){try{await navigator.clipboard.writeText($('calendar-url').value);notify('日历链接已复制，请在你的日历里添加订阅。')}catch(e){$('calendar-url').select();notify('请复制选中的日历链接。')}}

function chooseCalendar(){$('calendar-dialog').close();showPage('settings');$('calendar-heading').scrollIntoView({behavior:'smooth'});$('calendar_method').focus()}
async function exportCalendar(data){try{let r=await fetch('/api/calendar/export',{method:'POST',headers:{'Content-Type':'application/json','X-Token':token},body:JSON.stringify(data)});let d=await r.json();if(!r.ok)throw Error(d.error);const url=URL.createObjectURL(new Blob([d.ics],{type:'text/calendar;charset=utf-8'}));let link=document.createElement('a');link.href=url;link.download='审核后的日程.ics';link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);notify('请打开日历文件，确认导入。');$('calendar-dialog').close()}catch(e){$('status').textContent=e.message}}
async function toggleAuto(){let starting=!enabled;if(await call('/api/auto',{enabled:starting})){if(starting&&!localStorage.getItem('auto-tip-seen')){notify('电脑保持开机且程序运行时，自动分析会持续工作。');localStorage.setItem('auto-tip-seen','1')}}}
function element(tag,text,cls){let e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
function field(label,value,type){let wrap=element('label',label);let input=document.createElement('input');input.type=type||'text';input.value=value||'';wrap.append(input);return [wrap,input]}
function notify(text){$('notice').hidden=false;$('notice').textContent=text;let target=$('settings-page').hidden?$('notice'):$('settings-status');if(target)target.textContent=text}
function showPage(name){for(let page of ['important','mail','settings']){$(page+'-page').hidden=page!==name;$('nav-'+page).className=page===name?'':'secondary';$('nav-'+page).setAttribute('aria-current',page===name?'page':'false')}window.scrollTo(0,0)}
function value(text){return !text||/^(未说明|此封邮件暂无|无)$/.test(text)?'此封邮件暂无':text}
async function openSource(m){let box=$('source-content');box.replaceChildren(element('h3',m.subject),element('p',m.sender+' · '+m.date,'meta'));let status=element('p','加载原文…');box.append(status);$('source-dialog').showModal();try{let r=await fetch('/api/source',{method:'POST',headers:{'Content-Type':'application/json','X-Token':token},body:JSON.stringify({id:m.id})});let data=await r.json();if(!r.ok)throw Error(data.error);if(!$('source-dialog').open||!box.contains(status))return;status.remove();let frame=document.createElement('iframe');frame.title='原邮件正文';frame.setAttribute('sandbox','allow-popups allow-popups-to-escape-sandbox');frame.referrerPolicy='no-referrer';frame.className='original-frame';function display(external){let content=data.html;if(external)content=content.replace(/data-external="(\d+)"/g,(_,i)=>'src="'+String(data.external[Number(i)]||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')+'"');frame.srcdoc='<meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src data: '+(external?'https:':'')+'; style-src \'unsafe-inline\'">'+'<style>body{font:15px -apple-system,sans-serif;line-height:1.7;overflow-wrap:anywhere;margin:12px}img{max-width:100%;height:auto}table{max-width:100%}pre{white-space:pre-wrap}a{color:#235b4b}.todo-block{margin-top:14px;line-height:1.7}.original-frame{display:block;width:100%;height:60vh;border:0;margin-top:16px}#source-dialog{max-width:900px}.course-filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;padding-top:12px;border-top:1px solid #dde5df}.course-filters button{margin:0;padding:8px 12px;font-size:13px;background:white;color:#52665a;border:1px solid #dbe4de}.course-filters button.active{background:#e4efe8;border-color:#397158;color:#235b4b}.mail-card{padding:18px 20px;margin:14px 0}.mail-header{font-size:15px;font-weight:400;line-height:1.6;cursor:pointer}.mail-header .tag{margin-left:6px}.mail-title{display:block;font-size:17px;font-weight:600;margin:5px 0;overflow-wrap:anywhere}.mail-detail{margin-top:18px;border-top:1px solid #edf0ee;padding-top:2px}.fold-close{font-size:13px;padding:8px 12px}</style>'+content}if(data.external.length){let load=element('button','加载外部图片','secondary');load.onclick=()=>{display(true);load.remove()};box.append(load)}display(false);box.append(frame);await refresh()}catch(e){status.textContent=e.message;box.append(element('p',m.body,'body'))}}

function openCalendar(m,event,index){let box=$('calendar-form');box.replaceChildren();$('calendar-message').textContent='核对日期和时间后确认。时间按本机时区解释。';
 let [tw,title]=field('日程标题',event.title),[sw,start]=field('开始时间',event.start?.slice(0,16),'datetime-local'),[ew,end]=field('结束时间',event.end?.slice(0,16),'datetime-local'),[lw,place]=field('地点',event.location);
 let grid=element('div','','grid');grid.append(tw,sw,ew,lw);box.append(grid);let [dw,day]=field('全天日程','','checkbox');day.checked=event.allDay===true;day.style.width='auto';box.append(dw,element('p',event.evidence||'','meta'));

function jumpMail(id){let m=state.mails.find(x=>x.id===id);if(!m)return;selected=m.category;selectedCourse='全部课程';expandedMails.add(id);showPage('mail');render();let card=document.getElementById('mail-'+id);card.scrollIntoView({behavior:'smooth',block:'center'});card.classList.add('highlight')}
function importantTime(pin,event,now=new Date()){
 let start=new Date(pin.due),limit=new Date(start);if(event?.allDay)limit.setHours(23,59,59,999);
 let ms=limit-now,days=Math.ceil(ms/86400000),relative=ms<0?(event?.kind==='截止'?'已过截止时间':'已过活动时间'):ms<3600000?'不足 1 小时':ms<86400000?'还剩 '+Math.ceil(ms/3600000)+' 小时':'还剩 '+days+' 天';
 let date=event?.allDay?pin.due.slice(0,10):pin.due.slice(0,16).replace('T',' ');
 if(event?.kind==='截止')date+=' 截止';else if(event?.end&&!event.allDay)date+=' – '+event.end.slice(0,16).replace('T',' ');
 return {date,relative,expired:ms<0};
}
function renderImportant(d){
 $('pins').replaceChildren();$('completed-pins').replaceChildren();
 let pins=[...(d.pins||[])].sort((a,b)=>new Date(a.due)-new Date(b.due)||a.title.localeCompare(b.title));

 if(!active.length){let empty=element('section');let b=element('button','去邮件处理','secondary');b.onclick=()=>showPage('mail');empty.append(b);$('pins').append(empty)}
 $('completed-panel').hidden=!completed.length;$('completed-title').textContent='已完成（'+completed.length+'）';
 for(let pin of pins){let m=d.mails.find(m=>m.id===pin.mail_id);if(!m)continue;let result=m.result?JSON.parse(m.result):{},event=result.events?.[pin.event_index],done=pin.state==='completed';let row=element('article','','important-card'),time=importantTime(pin,event);row.append(element('h3',pin.title));let when=element('p',time.date+' · '+(done?'已完成':time.relative),!done&&time.expired?'important-time overdue':'important-time');row.append(when);
 let detail=event?.location?'地点：'+event.location:result.action;if(Array.isArray(detail))detail=detail.join('；');if(typeof detail==='string'&&detail&&!/^(未说明|此封邮件暂无|无)$/.test(detail))row.append(element('p',detail,'meta'));
 let actions=element('div','','important-actions');let source=element('button','查看原邮件','secondary');source.onclick=()=>jumpMail(pin.mail_id);actions.append(source);
 let saved=(d.calendarEvents||[]).find(x=>x.mail_id===pin.mail_id&&x.event_index===pin.event_index&&x.status!=='failed');if(event){if(saved)actions.append(element('small',saved.status==='saved'?'已加入日历':saved.status==='subscribed'?'已加入邮件助手日历':'请核对日历写入结果'));else{let calendar=element('button','加入日历','secondary task');calendar.disabled=d.status.busy;calendar.onclick=()=>openCalendar(m,event,pin.event_index);actions.append(calendar)}}
 for(let [label,action] of [[done?'恢复':'标记完成',done?'pin':'complete'],['移除','remove']]){let b=element('button',label,'secondary');b.onclick=()=>call('/api/pin',{id:pin.mail_id,index:pin.event_index,action});actions.append(b)}row.append(actions);$(done?'completed-pins':'pins').append(row)
 }
}
function displaySubject(subject){return String(subject||'').replace(/^(?:\s*(?:转发|轉發|fw|fwd)\s*[:：]\s*)+/i,'').trim()||'无主题'}
function courseCodes(m){
 const find=text=>[...new Set(Array.from(String(text||'').matchAll(/(?:^|[^A-Za-z0-9])([A-Za-z]{3})[ \t]*(\d{3})(?![A-Za-z0-9])/g),x=>x[1].toUpperCase()+' '+x[2]))];
 let subject=find(m.subject);return subject.length?subject:find(m.body);
}
function renderCourses(d){let box=$('course-filters');box.replaceChildren();box.hidden=selected!=='课程与教学';if(box.hidden)return;let items=d.mails.filter(m=>m.category==='课程与教学'),codes=[...new Set(items.flatMap(courseCodes))].sort();if(items.some(m=>!courseCodes(m).length))codes.push('未识别课程');if(selectedCourse!=='全部课程'&&!codes.includes(selectedCourse))selectedCourse='全部课程';for(let code of ['全部课程',...codes]){let count=items.filter(m=>matchesCourse(m,code)).length;let b=element('button',code+' '+count,code===selectedCourse?'active':'');b.setAttribute('aria-pressed',String(code===selectedCourse));b.onclick=()=>{selectedCourse=code;render()};box.append(b)}}
function matchesCourse(m,code){let codes=courseCodes(m);return code==='全部课程'||(code==='未识别课程'?!codes.length:codes.includes(code))}
function render(){if(!state)return;let d=state;$('filters').replaceChildren();for(let cat of ['全部',...categories]){let count=d.mails.filter(m=>cat==='全部'||m.category===cat).length;let b=element('button',cat+' '+count,selected===cat?'active':'');b.onclick=()=>{selected=cat;selectedCourse='全部课程';render()};$('filters').append(b)}
 renderImportant(d);renderCourses(d);
 $('mails').replaceChildren();let mails=d.mails.filter(m=>(selected==='全部'||m.category===selected)&&(selected!=='课程与教学'||matchesCourse(m,selectedCourse)));if(!mails.length)$('mails').append(element('section','暂无邮件'));
 let written=new Map((d.calendarEvents||[]).map(x=>[x.mail_id+':'+x.event_index,x]));for(let m of mails){let card=element('article','','mail-card');card.id='mail-'+m.id;let fold=element('details','','mail-fold');fold.open=expandedMails.has(m.id);let header=element('summary','','mail-header');header.append(element('span',m.category,'tag'),element('span',displaySubject(m.subject),'mail-title'));let date=new Date(m.date);header.append(element('span',Number.isNaN(date.getTime())?m.date:date.toLocaleDateString('zh-CN'),'meta'));fold.append(header);let a=element('div','','mail-detail');fold.addEventListener('toggle',()=>{if(fold.open)expandedMails.add(m.id);else expandedMails.delete(m.id)});let v=m.result?JSON.parse(m.result):null;
 if(v){let facts=element('div','','facts');for(let [key,label] of [['time','时间'],['location','地点']]){let f=element('div','','fact');f.append(element('strong',label),document.createTextNode(value(v[key])));facts.append(f)}a.append(facts);
 let todo=element('div','','fact todo-block');todo.append(element('strong','待办'),element('div',value(v.action)));a.append(todo);
 a.append(element('h4','智能摘要','summary-heading'),element('p',value(v.summary),'summary-text'));
 for(let [i,event] of (v.events||[]).entries()){let row=element('div','','event-row');row.append(element('span',(event.kind==='截止'?'截止日期':'活动时间')+' · '+(event.allDay?event.start.slice(0,10):event.start.slice(0,16).replace('T',' '))+' · '+event.title));let saved=written.get(m.id+':'+i);if(saved&&saved.status!=='failed')row.append(element('small',saved.status==='saved'?'已加入日历':saved.status==='subscribed'?'已加入邮件助手日历':'请核对日历写入结果'));else{let b=element('button','加入日历','secondary task');b.disabled=d.status.busy;b.onclick=()=>openCalendar(m,event,i);row.append(b)}{let pinned=d.pins.some(p=>p.mail_id===m.id&&p.event_index===i&&p.state==='active');let b=element('button',pinned?'已加入重要事项':'加入重要事项','secondary');b.disabled=pinned;b.onclick=()=>call('/api/pin',{id:m.id,index:i,action:'pin'});row.append(b)}a.append(row)}
 if(!Object.hasOwn(v,'events')){let b=element('button','提取日程与截止日期','secondary task');b.disabled=d.status.busy;b.onclick=()=>call('/api/events/extract',{id:m.id});a.append(b)}
 }else{let b=element('button','分析邮件','task');b.disabled=d.status.busy;b.onclick=()=>call('/api/analyze',{id:m.id});a.append(b)}
 let links=element('div','','source-links'),original=element('button','查看原邮件','secondary');original.onclick=()=>openSource(m);links.append(original);let supplied=(m.links||[]).map(x=>typeof x==='string'?{url:x,label:x}:x).filter(x=>/^https?:\/\//i.test(x.url));if(supplied.length){let list=element('div','','mail-links');list.append(element('h4','相关链接'));let extra=element('details'),heading=element('summary','展开其他链接（'+Math.max(0,supplied.length-3)+'）');extra.append(heading);for(let [i,item] of supplied.entries()){let link=element('a',(item.label||item.url)+' ↗');link.href=item.url;link.target='_blank';link.rel='noopener noreferrer';link.title=item.url;(i<3?list:extra).append(link)}if(supplied.length>3)list.append(extra);links.append(list)}a.append(links,element('p',m.sender+' · '+m.date,'meta'));let close=element('button','收起','secondary fold-close');close.onclick=()=>{fold.open=false;expandedMails.delete(m.id);header.scrollIntoView({block:'nearest'})};a.append(close);fold.append(a);card.append(fold);$('mails').append(card)}
}
async function refresh(){try{let r=await fetch('/api/state',{headers:{'X-Token':token}});if(!r.ok)throw Error('无法连接');let d=await r.json();
  if(!initialized&&d.config){providers=d.providers||{};for(let [id,p] of Object.entries(providers)){let o=element('option',p.name);o.value=id;$('provider').append(o)}for(let k of ['school_sender','account','base'])$(k).value=d.config[k]||'';$('provider').value=d.config.provider||'custom';$('provider-hint').textContent=providers[$('provider').value]?.hint||'';modelOptions([],d.config.model||'');$('calendar_method').value=d.config.calendar_method||'unset';$('calendar-ready').textContent=d.config.calendar_method==='subscribe'?'链接已生成':d.config.calendar_method&&d.config.calendar_method!=='unset'?'✓ 已保存':'未设置';$('calendar-ready').className='connection-state'+(d.config.calendar_method&&d.config.calendar_method!=='unset'&&d.config.calendar_method!=='subscribe'?' success':'');calendarHelp();initialized=true}
