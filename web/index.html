<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邮件助手</title><meta name="csrf-token" content="__TOKEN__"><link rel="stylesheet" href="/styles.css"><main><div class="top"><h1>邮件助手</h1><div id="mail-controls" class="header-mail-controls" hidden><button type="button" class="secondary task" onclick="checkMail()">立即检查</button><button type="button" id="auto" class="auto-switch-control task" role="switch" aria-checked="false" aria-label="自动检查" title="每分钟检查新邮件并自动分析" onclick="toggleAuto()"><span>自动检查</span><span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></button></div></div><div id="header-mail-feedback" class="header-mail-feedback" hidden><span id="status" role="status" hidden></span><button id="setup-link" class="text-button" onclick="showSetup()" hidden>去账户设置</button></div>
<div id="notice" role="status" hidden></div><div id="settings-page" hidden><h2 class="settings-section-title">连接设置</h2><details id="mail-settings" class="settings-panel"><summary><strong>邮箱</strong><button id="mail-save" class="mail-control settings-save" onclick="event.preventDefault();connectionAction('mail','save')">连接并保存</button><span id="mail-ready" hidden></span></summary><div class="setting-input-row"><select id="mail_provider" aria-label="选择接收转发邮件的邮箱"><option value="">选择接收转发邮件的邮箱</option><option value="qq">QQ 邮箱</option><option value="netease">网易邮箱（163 / 126）</option></select></div><div id="mail-provider-fields" hidden><div class="forwarding-required"><div class="field-heading"><span id="forwarding-reminder" class="forwarding-reminder">＊ 必须设置</span><strong id="forwarding-title">设置学校邮件自动转发至接收邮箱</strong><a href="/assets/guides/outlook.html" onclick="event.preventDefault();openSetupGuide('outlook')">查看教程 ↗</a></div><button id="confirm-forwarding" class="field-status" type="button" onclick="confirmForwarding()" title="点击确认已设置转发" aria-label="点击确认已设置转发">○</button></div><label for="school_sender">学校邮箱</label><div class="setting-input-row"><input id="school_sender" placeholder="填写学校邮箱地址，本软件仅导入此地址转发的邮件。" autocomplete="off"><span id="school_sender-status" class="field-status" role="status"></span></div><label for="account" id="account-label">接收邮箱</label><div class="setting-input-row"><input id="account" placeholder="完整邮箱地址" autocomplete="off"><span id="account-status" class="field-status" role="status"></span></div><div class="field-heading"><label for="password" id="password-mail-label">邮箱客户端授权码</label><a id="mail-auth-guide" href="/assets/guides/qq.html" onclick="event.preventDefault();openSetupGuide('qq')">如何获取 ↗</a></div><div class="setting-input-row"><input id="password" type="password" autocomplete="new-password" placeholder="填写邮箱客户端授权码"><span id="password-status" class="field-status" role="status"></span></div><p><a id="mail-provider-link" href="https://mail.qq.com/" target="_blank" rel="noopener noreferrer">打开邮箱 ↗</a></p></div><p id="mail-feedback" role="status"></p></details>
<details id="ai-settings" class="settings-panel"><summary><strong>AI 服务</strong><button id="ai-save" class="ai-control settings-save" onclick="event.preventDefault();connectionAction('ai','save')">连接并保存</button><span id="ai-ready" hidden></span></summary><label for="provider">服务商</label><div class="setting-input-row"><select id="provider" onchange="providerChanged()"></select><span id="provider-status" class="field-status" role="status"></span></div><div class="field-heading"><label for="key">API Key</label><a id="api-key-help" target="_blank" rel="noopener noreferrer" hidden></a><span id="api-key-help-note" class="meta" hidden>请到你使用的服务平台获取</span></div><div class="setting-input-row"><input id="key" type="password" autocomplete="new-password" placeholder="填写当前服务商的 API Key"><span id="key-status" class="field-status" role="status"></span></div><p id="provider-hint" class="meta"></p><div class="field-heading"><label for="model-choice">模型</label><button class="text-button ai-control" onclick="connectionAction('ai','models')">获取列表 ↻</button></div><div class="setting-input-row"><select id="model-choice" onchange="modelChoiceChanged();connectionEdited('ai')"><option value="">先获取模型列表</option><option value="__manual__">手动输入模型 ID</option></select><span id="model-status" class="field-status" role="status"></span></div><label id="manual-model" hidden>模型 ID<input id="model" placeholder="服务商提供的模型 ID 或接入点 ID"></label><details id="ai-advanced"><summary>自定义接口地址</summary><label>接口基础地址<input id="base" placeholder="HTTPS 基础地址"></label><p class="meta">通常无需修改。</p></details><p id="ai-feedback" role="status"></p></details>
<details id="calendar-settings" class="settings-panel"><summary><strong id="calendar-heading">日历</strong><button id="calendar-connect" class="settings-save" onclick="event.preventDefault();calendarAction()">确认订阅</button><span id="calendar-ready" hidden></span></summary><div id="calendar-choice"><div class="field-heading"><label for="calendar_provider">日历类型</label><button id="calendar-show-guide" class="text-button" onclick="showCalendarGuide()" hidden>订阅教程 ↗</button></div><div class="setting-input-row"><select id="calendar_provider" onchange="calendarHelp()"><option value="" disabled selected>请选择日历</option><option value="apple">Apple 日历</option><option value="outlook">Outlook 日历</option></select><span id="calendar-confirm" class="field-status" role="status" hidden>○</span></div></div><p id="calendar-feedback" role="status"></p><div id="calendar-subscription" hidden><label for="calendar-url">订阅链接</label><div class="setting-input-row"><input id="calendar-url" type="password" readonly aria-label="专属订阅链接" onclick="this.type='text';this.select()" onblur="this.type='password'"><span class="field-status"><button type="button" class="secondary calendar-copy" onclick="copyCalendarUrl()">复制</button></span></div></div></details>
<h3 class="settings-section-title">账号与安全</h3><details id="profile-settings" class="settings-panel"><summary><strong>密码与登录</strong></summary><form id="account-form"><label>当前密码<input id="old-password" type="password" autocomplete="current-password" maxlength="128" required></label><label>新密码<input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="至少 8 个字符" required></label><button type="submit">修改密码</button></form><button id="logout" class="secondary" type="button">退出登录</button><p id="account-feedback" role="status"></p></details><p id="settings-status" role="status"></p></div>
<div id="important-page"><details class="important-help"><summary>日程安排和截止事项有什么区别？</summary><p>有明确开始和结束时间的安排，放在“日程安排”；需要在某个日期前完成、但没有固定时段的任务，放在“截止事项”。由你决定是否加入。</p></details><div class="important-workspace"><aside id="calendar-view" aria-label="事项日历"></aside><section class="important-list-pane" aria-label="事项列表"><nav class="calendar-filter" aria-label="日历事项筛选"><button id="view-all" onclick="setImportantView('all')">全部</button><button id="view-schedule" onclick="setImportantView('schedule')">日程安排</button><button id="view-deadline" onclick="setImportantView('deadline')">截止事项</button></nav><div id="important-list-view"></div></section></div></div><div id="mail-page" hidden><div class="mail-search" role="search"><label for="mail-search-input">搜索邮件</label><div class="mail-search-controls"><input id="mail-search-input" type="search" placeholder="搜索标题、发件人、正文或待办" autocomplete="off"><button id="mail-search-clear" type="button" class="secondary" hidden>清空</button></div><p id="mail-search-status" class="meta" role="status" aria-live="polite" hidden></p></div><nav class="filters" id="filters" aria-label="邮件分类"></nav><nav id="course-filters" class="course-filters" aria-label="课程分类" hidden></nav><div class="mail-workspace"><div id="mails" aria-label="邮件列表"></div><section id="mail-detail-pane" aria-label="邮件正文"></section></div></div></main><nav class="tabs" aria-label="页面切换"><button id="nav-important" onclick="showPage('important')">重要事项</button><button id="nav-mail" class="secondary" onclick="showPage('mail')">邮件处理</button><button id="nav-settings" class="secondary" onclick="showPage('settings')">账户设置</button></nav><dialog id="calendar-month-dialog"><h2>选择年月</h2><form id="calendar-month-form"><div class="grid"><label>年份<input id="calendar-year-input" type="number" min="1" max="9999" required></label><label>月份<select id="calendar-month-input"><option value="1">1月</option><option value="2">2月</option><option value="3">3月</option><option value="4">4月</option><option value="5">5月</option><option value="6">6月</option><option value="7">7月</option><option value="8">8月</option><option value="9">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option></select></label></div><div class="calendar-form-actions"><button type="button" class="secondary" onclick="$('calendar-month-dialog').close()">取消</button><button type="submit">确定</button></div></form></dialog><dialog id="course-add-dialog"><h2>手工添加课程</h2><form id="course-add-form"><label for="course-code-input">课程代码</label><input id="course-code-input" placeholder="例如 CSI101 或 CSI 101" required maxlength="20" autocomplete="off"><p class="meta">输入三字母加三数字。按邮件原文中的课程代码匹配，自动发现的课程仍会保留。</p><p id="course-add-error" role="alert" hidden></p><div class="calendar-form-actions"><button type="button" class="secondary" onclick="$('course-add-dialog').close()">取消</button><button type="submit">添加课程</button></div></form></dialog><dialog id="calendar-dialog" class="calendar-dialog"><h2>添加到日历</h2><div id="calendar-form"></div><p id="calendar-message" role="status" hidden></p></dialog><dialog id="event-edit-dialog" class="event-edit-dialog"><h2>编辑事项</h2><form id="event-edit-form" class="event-edit-form"></form></dialog><dialog id="event-join-dialog" class="event-edit-dialog event-join-dialog"><h2>核对已有事项</h2><div id="event-join-content"></div></dialog><dialog id="source-dialog" aria-labelledby="source-title"><header class="source-dialog-header"><h2 id="source-title">原邮件</h2><button type="button" class="modal-close-x source-close-x" aria-label="关闭原邮件" onclick="closeSource()">×</button></header><div id="source-content"></div><button type="button" onclick="closeSource()">关闭</button></dialog>
<dialog id="setup-guide-dialog" class="setup-guide-dialog" aria-labelledby="setup-guide-title"><header class="setup-guide-header"><h2 id="setup-guide-title"></h2><button type="button" class="modal-close-x guide-close-x" aria-label="关闭教程" onclick="closeSetupGuide()">×</button></header><div id="setup-guide-content"></div><footer><button type="button" onclick="closeSetupGuide()">关闭</button></footer></dialog>
