<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · TimeMate</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#26333f;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:32px 20px}main{width:100%;max-width:420px;background:#fff;border:1px solid #e0e6e9;border-radius:20px;padding:36px}h1{font-size:30px;letter-spacing:-1px;margin:0 0 28px;font-weight:650}.switch{display:flex;gap:24px;border-bottom:1px solid #e7eceb;margin-bottom:26px}.switch button{border:0;border-bottom:2px solid transparent;background:none;padding:0 0 12px;color:#708078;font:inherit;cursor:pointer}.switch button[aria-selected=true]{color:#235b4b;border-color:#235b4b}label:not(.consent){display:block;font-size:14px;color:#596a75;margin:20px 0 8px}input:not([type=checkbox]){width:100%;min-width:0;height:48px;border:1px solid #ccd7dd;border-radius:9px;padding:0 13px;font:inherit;color:#26333f;background:white}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #39876b;outline-offset:3px}.code-row{display:flex;gap:10px}.code-row input{flex:1;min-width:0}.send{flex-shrink:0;border:0;border-radius:9px;background:#edf3f0;color:#235b4b;padding:0 14px;font:inherit;cursor:pointer}.send:disabled{opacity:.55}.consent{display:flex;gap:9px;align-items:flex-start;margin-top:22px;font-size:14px;line-height:22px;color:#65736e}.consent input{width:17px;height:17px;margin:2px 0 0;accent-color:#235b4b;flex-shrink:0}a{color:#235b4b;text-underline-offset:3px}#submit{width:100%;height:48px;margin-top:24px;border:0;border-radius:9px;background:#235b4b;color:white;font:inherit;cursor:pointer}#submit:disabled{opacity:.4;cursor:not-allowed}#message{font-size:14px;color:#a34435;line-height:1.6}#message:empty{display:none}.forgot{display:block;margin:16px 0 0 auto;border:0;background:none;font:14px inherit;color:#235b4b;cursor:pointer;padding:0}.back{border:0;background:none;color:#235b4b;font:14px inherit;padding:0;cursor:pointer;margin-top:16px}[hidden]{display:none!important}@media(max-width:480px){main{padding:28px 24px}body{padding:20px 16px}}
</style><main><h1>TimeMate</h1><nav class="switch" aria-label="账号操作"><button type="button" id="login-tab" onclick="mode('login')">登录</button><button type="button" id="register-tab" onclick="mode('register')">注册</button></nav><form id="form"><div id="email-row"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" maxlength="254" required></div><div id="code-row" hidden><label for="code">邮箱验证码</label><div class="code-row"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"><button type="button" class="send" id="send-code">获取验证码</button></div></div><div id="reset-row" hidden><label for="reset-code">邮箱验证码</label><div class="code-row"><input id="reset-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"><button type="button" class="send" id="send-reset-code">发送重置码</button></div></div><label for="password" id="password-label">密码</label><input id="password" type="password" autocomplete="current-password" maxlength="128" required><button type="button" class="forgot" id="forgot" onclick="mode('reset')">忘记密码？</button><button type="button" class="back" id="back" hidden onclick="mode('login')">← 返回登录</button><label class="consent" id="consent-group" hidden><input type="checkbox" id="consent"><span>我已阅读并同意<a href="/privacy" target="_blank" rel="noopener noreferrer">《隐私说明》</a></span></label><button id="submit">登录</button><p id="message" role="status"></p></form></main>
<script>
let action='login';const $=id=>document.getElementById(id);
function mode(value){action=value;$('login-tab').setAttribute('aria-selected',String(value==='login'));$('register-tab').setAttribute('aria-selected',String(value==='register'));$('forgot').hidden=value!=='login';$('back').hidden=value!=='reset';$('consent-group').hidden=value!=='register';$('consent').required=value==='register';$('code-row').hidden=value!=='register';$('reset-row').hidden=value!=='reset';$('code').required=value==='register';$('send-code').hidden=value!=='register';$('email').required=true;$('submit').textContent={login:'登录',register:'注册',reset:'重置密码'}[value];$('password-label').textContent=value==='reset'?'新密码':'密码';$('submit').disabled=(value==='register'&&(!$('consent').checked||!$('code').value))||(value==='reset'&&!$('reset-code').value);$('password').autocomplete=value==='login'?'current-password':'new-password';$('password').minLength=value==='login'?1:8;$('password').placeholder=value==='login'?'':'至少 8 个字符';$('message').textContent=''}
async function readResponse(response){const body=await response.text();try{return JSON.parse(body)}catch{throw Error('服务暂时没有正常响应，请稍后重试。')}}
async function sendCode(endpoint,buttonId){const button=$(buttonId),defaultLabel=buttonId==='send-code'?'获取验证码':'发送重置码';if(!$('email').value){$('message').textContent='请先填写邮箱地址。';return}button.disabled=true;button.textContent='发送中…';$('message').textContent='';try{const r=await fetch('/api/auth/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value})});const d=await readResponse(r);if(!r.ok)throw Error(d.error||'验证码发送失败，请重试。');button.textContent='已发送'}catch(e){button.textContent=defaultLabel;$('message').textContent=e.message}finally{button.disabled=false}}
$('send-code').onclick=()=>sendCode('send-code','send-code');$('send-reset-code').onclick=()=>sendCode('send-reset-code','send-reset-code');$('email').oninput=()=>{$('send-code').textContent='获取验证码';$('send-reset-code').textContent='发送重置码';$('message').textContent=''};
$('form').onsubmit=async e=>{e.preventDefault();if(action==='register'&&(!$('code').value||!$('consent').checked))return;if(action==='reset'&&!$('reset-code').value)return;$('submit').disabled=true;try{const r=await fetch('/api/auth/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value,code:action==='reset'?$('reset-code').value:$('code').value})});const d=await readResponse(r);if(!r.ok)throw Error(d.error||'暂时无法完成，请重试。');if(action==='reset'){mode('login');$('password').value='';$('reset-code').value='';$('message').textContent='密码已更新，请重新登录。'}else location.href='/'}catch(error){$('message').textContent=error.message}finally{$('submit').disabled=(action==='register'&&(!$('consent').checked||!$('code').value))||(action==='reset'&&!$('reset-code').value)}};
$('code').oninput=()=>{$('submit').disabled=action==='register'&&(!$('consent').checked||!$('code').value)};$('reset-code').oninput=()=>{$('submit').disabled=action==='reset'&&!$('reset-code').value};$('consent').onchange=()=>{$('submit').disabled=action==='register'&&(!$('consent').checked||!$('code').value)};mode('login');
</script></html>
