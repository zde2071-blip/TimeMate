<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接 Grok Bot 通知</title><style>body{font-family:system-ui,sans-serif;background:#f5f7f8;color:#253b33;margin:0}main{max-width:900px;margin:auto;padding:24px;background:white}figure{margin:24px 0}figcaption{font-weight:600;margin-bottom:16px}img{display:block;width:100%;height:auto}p{line-height:1.7}</style><main><h1>连接 Grok Bot 通知</h1><figure><figcaption>1. 打开 Bot 详情中的“TimeMate 变更反馈”</figcaption><img src="/assets/grok-setup/01.png" width="1254" height="1254" alt="Bot 详情的例行任务列表，箭头指向 TimeMate 变更反馈"><p>先将“通知指令”发给 Grok Bot，等它创建任务；再点击聊天顶部的 Bot 名称。</p></figure><figure><figcaption>2. 将通知地址和密钥填回 TimeMate</figcaption><img src="/assets/grok-setup/02.png" width="1389" height="1132" alt="Webhook 设置，箭头分别指向 POST 到和密钥右侧的复制按钮，地址已遮挡"><p>POST 到 → 通知地址；密钥 → 通知密钥。分别复制到当前“反馈”页并保存，不要把密钥发到聊天里。</p></figure></main></html>
