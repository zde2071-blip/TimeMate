<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接 Grok Bot 通知</title><style>body{font-family:system-ui,sans-serif;background:#f5f7f8;color:#253b33;margin:0}main{max-width:900px;margin:auto;padding:24px;background:white}figure{margin:24px 0}figcaption{font-weight:600;margin-bottom:16px}img{display:block;width:100%;height:auto}p{line-height:1.7}</style><main><h1>连接 Grok Bot 通知</h1><figure><figcaption>打开 Bot 详情，再打开“TimeMate 变更反馈”</figcaption><img src="/assets/grok-setup/01-full.png" width="1468" height="1071" alt="完整 Grok Bot 窗口，序号一指向顶部 Bot 名称，序号二指向右侧通知任务"><p>先将“通知指令”发给 Grok Bot，等它创建任务；再点击聊天顶部的 Bot 名称。</p></figure><figure><figcaption>将通知地址和密钥填回 TimeMate</figcaption><img src="/assets/grok-setup/02-full.png" width="1467" height="1072" alt="完整 Grok Bot 窗口，序号三和四指向右侧 Webhook 地址与密钥的复制按钮，隐私已遮挡"><p>POST 到 → 通知地址；密钥 → 通知密钥。分别复制到当前“反馈”页并保存，不要把密钥发到聊天里。</p></figure></main></html>
