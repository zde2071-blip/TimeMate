<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>获取网易邮箱客户端授权码</title><style>body{font-family:system-ui,sans-serif;color:#253b33;background:#f5f7f8;margin:0}main{max-width:1100px;margin:32px auto;padding:24px;background:white}h1{font-size:26px}figure{margin:24px 0}figcaption{font-weight:600;margin-bottom:12px}img{width:100%;height:auto;display:block}a{color:#245e4d}</style></head><body><main><h1>获取网易邮箱客户端授权码</h1><div class="forwarding-guide"><figure><figcaption>1. 点击顶部“设置”，再选择“POP3/SMTP/IMAP”</figcaption><div class="annotated-shot"><img src="/assets/netease-mail/01.png" width="1000" height="1000" alt="网易邮箱顶部设置菜单，POP3/SMTP/IMAP 选项已展开" loading="eager" fetchpriority="high" decoding="async"><svg viewBox="0 0 1000 1000" aria-hidden="true"><path class="mark-line" d="M 835 104 L 215 137"/><path fill="#e21d24" d="M190 137 l26 -15 -2 30 z"/><circle class="mark-circle" cx="860" cy="102" r="42"/><text class="mark-number" x="860" y="102">1</text><path class="mark-line" d="M 817 640 L 470 640"/><path fill="#e21d24" d="M445 640 l26 -15 -2 30 z"/><circle class="mark-circle" cx="860" cy="640" r="42"/><text class="mark-number" x="860" y="640">2</text></svg></div></figure><figure><figcaption>3. 开启 IMAP/SMTP 服务，再按页面提示新增客户端授权密码</figcaption><div class="annotated-shot"><img src="/assets/netease-mail/02.png" width="1900" height="850" alt="网易邮箱 POP3/SMTP/IMAP 设置页面，IMAP/SMTP 服务开启入口" loading="lazy" decoding="async"><svg viewBox="0 0 1900 850" aria-hidden="true"><path class="mark-line" d="M 1515 160 L 848 160"/><path fill="#e21d24" d="M820 160 l28 -16 0 32 z"/><circle class="mark-circle" cx="1560" cy="160" r="46"/><text class="mark-number" x="1560" y="160">3</text></svg></div></figure></div></main></body></html>
