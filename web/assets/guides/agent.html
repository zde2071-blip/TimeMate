<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接 TimeMate</title><style>body{font-family:system-ui,sans-serif;color:#253b33;background:#f5f7f8;margin:0}main{max-width:1100px;margin:32px auto;padding:24px;background:white}h1{font-size:26px}figure{margin:32px 0}figcaption{font-weight:600;margin-bottom:12px}img{width:100%;height:auto;display:block}a{color:#245e4d}p{line-height:1.7} .setup-links{display:flex;gap:16px;flex-wrap:wrap}</style></head><body><main><h1>连接 TimeMate</h1><div class="forwarding-guide"><figure><figcaption>1. 点击右上角“添加”</figcaption><img src="/assets/agent-setup/01.png" width="1568" height="1003" alt="1. 点击右上角“添加”" loading="eager" decoding="async"></figure><figure><figcaption>2. 选择“添加自定义 MCP 服务器”</figcaption><img src="/assets/agent-setup/02.png" width="1568" height="1003" alt="2. 选择“添加自定义 MCP 服务器”" loading="lazy" decoding="async"></figure><p>名称填写 <strong>TimeMate</strong>，连接地址填写 <code>https://timemate.cc/mcp</code>，身份验证选择 <strong>OAuth</strong>。图标和描述可留空。</p><figure><figcaption>3. 填写连接信息并创建</figcaption><img src="/assets/agent-setup/03.png" width="1278" height="1230" alt="3. 填写连接信息并创建" loading="lazy" decoding="async"></figure><p>阅读权限提示后，自行勾选并点击“创建为插件”，再登录并授权你的 TimeMate 账户。</p></div></main></body></html>
