<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>获取 API Key</title><style>body{font-family:system-ui,sans-serif;color:#253b33;background:#f5f7f8;margin:0}main{max-width:1100px;margin:32px auto;padding:24px;background:white}h1{font-size:26px}figure{margin:32px 0}figcaption{font-weight:600;margin-bottom:12px}img{width:100%;height:auto;display:block}a{color:#245e4d}p{line-height:1.7} .setup-links{display:flex;gap:16px;flex-wrap:wrap}</style></head><body><main><h1>获取 API Key</h1><p>在你选择的模型服务商开放平台创建 API Key，再回到下方选择同一家服务商、填写 Key、获取模型列表并选择文本模型，测试通过后保存。API Key 是调用模型的凭证，请勿发给他人；服务商可能按使用量收费。</p><div class="setup-links"><a href="https://platform.deepseek.com/" target="_blank" rel="noopener noreferrer">DeepSeek 开放平台（示例）↗</a></div><p>请在邮件助手中选择与你的 API Key 对应的服务商。DeepSeek 链接仅为示例，其他服务商请前往各自的开放平台获取。</p></main></body></html>
