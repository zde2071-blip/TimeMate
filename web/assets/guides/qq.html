<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>获取 QQ 邮箱授权码</title><style>body{font-family:system-ui,sans-serif;color:#253b33;background:#f5f7f8;margin:0}main{max-width:1100px;margin:32px auto;padding:24px;background:white}h1{font-size:26px}figure{margin:32px 0}figcaption{font-weight:600;margin-bottom:12px}img{width:100%;height:auto;display:block}a{color:#245e4d}p{line-height:1.7} .setup-links{display:flex;gap:16px;flex-wrap:wrap}</style></head><body><main><h1>获取 QQ 邮箱授权码</h1><div class="forwarding-guide"><figure><figcaption>1. 点击右上角设置</figcaption><a href="/assets/qq-mail/01.png" target="_blank" rel="noopener"><img src="/assets/qq-mail/01.png" alt="点击右上角设置" loading="lazy" decoding="async"></a></figure><figure><figcaption>2. 点击账号与安全</figcaption><a href="/assets/qq-mail/02.png" target="_blank" rel="noopener"><img src="/assets/qq-mail/02.png" alt="点击账号与安全" loading="lazy" decoding="async"></a></figure><figure><figcaption>3. 找到邮件服务并生成授权码</figcaption><a href="/assets/qq-mail/03.png" target="_blank" rel="noopener"><img src="/assets/qq-mail/03.png" alt="找到邮件服务并生成授权码" loading="lazy" decoding="async"></a></figure></div><p>如果邮件服务尚未开启，请先按 QQ 邮箱页面提示开启，再生成授权码。完成验证后，复制授权码；授权码和 QQ 密码不同，请勿发给他人。</p><p>回到下方邮箱设置，填写自己的完整 QQ 邮箱地址、授权码和学校邮箱地址，先点“测试连接”，成功后保存。</p><div class="setup-links"><a href="https://help.mail.qq.com/detail/106/985" target="_blank" rel="noopener noreferrer">QQ 邮箱官方授权码说明 ↗</a><a href="https://mail.qq.com/" target="_blank" rel="noopener noreferrer">打开 QQ 邮箱 ↗</a></div></main></body></html>
