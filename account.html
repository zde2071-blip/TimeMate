<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号 · 邮件助手</title><style>body{font:16px -apple-system,sans-serif;background:#f5f7f5;color:#243b30;padding:24px}main{max-width:400px;margin:6vh auto}label{display:block;margin:20px 0 8px}input,button{box-sizing:border-box;padding:12px;border-radius:8px;font:inherit;width:100%;border:1px solid #ccd8d0}button{margin-top:20px;background:#235b4b;color:white;border:0}a{color:#235b4b}p{line-height:1.6;font-size:14px}</style><main><a href="/">← 邮件助手</a><h1>账号</h1><form id="form"><label for="old">当前密码</label><input id="old" type="password" autocomplete="current-password" maxlength="128" required><label for="password">新密码</label><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="至少 8 个字符" required><button>修改密码</button></form><p id="message" role="status"></p><button id="logout">退出登录</button></main><script>const token='__TOKEN__';async function send(action,data){let r=await fetch('/api/auth/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-Token':token},body:JSON.stringify(data)});let d=await r.json();if(!r.ok)throw Error(d.error);return d}document.getElementById('form').onsubmit=async e=>{e.preventDefault();try{await send('password',{old:document.getElementById('old').value,password:document.getElementById('password').value});location.href='/account'}catch(e){document.getElementById('message').textContent=e.message}};document.getElementById('logout').onclick=async()=>{try{await send('logout',{});location.href='/login'}catch(e){document.getElementById('message').textContent=e.message}};</script></html>
