<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 邮件助手</title><style>
*{box-sizing:border-box}body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#f5f7f5;color:#243b30;margin:0;padding:24px}main{max-width:400px;margin:10vh auto;background:white;border:1px solid #e0e8e2;padding:32px;border-radius:18px}h1{font-size:26px;margin:0 0 28px}label{display:block;margin:18px 0 8px}input,button{font:inherit;border-radius:8px;padding:12px;width:100%;box-sizing:border-box}input{border:1px solid #cdd8d0}button{border:0;background:#235b4b;color:white;margin-top:22px;cursor:pointer}.switch{display:flex;gap:16px;margin-top:20px}.switch button{padding:0;background:none;color:#235b4b;width:auto;margin:0;font-size:14px}p{font-size:14px;line-height:1.6;color:#687a70}[hidden]{display:none!important}#message{color:#a34435}button:disabled{opacity:.5}</style>
<main><h1>邮件助手</h1><form id="form"><div id="email-row"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" maxlength="254" required></div><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" maxlength="128" required><div id="invite-row" hidden><label for="invite">邀请码</label><input id="invite" autocomplete="off"></div><div id="reset-row" hidden><label for="reset">重置码</label><input id="reset" autocomplete="off"><p>请联系邀请你的管理员，核实身份后获取重置码。</p></div><button id="submit">登录</button><p id="message" role="status"></p></form><div class="switch"><button onclick="mode('login')">登录</button><button onclick="mode('register')">受邀注册</button><button onclick="mode('reset')">忘记密码</button></div></main>
<script>let action='login';const $=id=>document.getElementById(id);function mode(value){action=value;$('email-row').hidden=value==='reset';$('email').required=value!=='reset';$('invite-row').hidden=value!=='register';$('reset-row').hidden=value!=='reset';$('submit').textContent={login:'登录',register:'注册',reset:'重置密码'}[value];$('password').autocomplete=value==='login'?'current-password':'new-password';$('password').minLength=value==='login'?1:8;$('password').placeholder=value==='login'?'':'至少 8 个字符';$('message').textContent=''}$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{let r=await fetch('/api/auth/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value,invite:$('invite').value,reset:$('reset').value})});let d=await r.json();if(!r.ok)throw Error(d.error||'暂时无法完成，请重试。');if(action==='reset'){mode('login');$('password').value='';$('message').textContent='密码已更新，请登录。'}else location.href='/'}catch(e){$('message').textContent=e.message}finally{$('submit').disabled=false}};</script></html>
